name: Expandir leyes estatales
run-name: "expandir-estatales estado=[${{ inputs.estado }}] sin_esperar=[${{ inputs.sin_esperar }}] ensayo=[${{ inputs.ensayo }}] simular=[${{ inputs.simular }}] simular_texto=[${{ inputs.simular_texto }}] redeclarar=[${{ inputs.redeclarar }}] origen=[${{ inputs.origen }}]"

# Ronda de expansión: suma un estado al corpus de leyes estatales sin que nadie
# trabaje en una computadora. Un agente encuentra el portal oficial de leyes
# vigentes del siguiente estado de extractor/estatales/pendientes.json y
# escribe su módulo (extractor/estatales/<estado>.py) y sus pruebas; código
# determinista decide si entra (scripts/expansion.py): solo esos archivos,
# pruebas en verde, build + auditar de cada ley sobre su PDF descargado desde un
# clon limpio (lo que no quede limpio pasa a FUERA) y nada de lo publicado
# cambia. Si entra, se publica en main y se pide su vigilancia, que da de alta
# cada ley tras su revisión completa (vigilar-leyes-estatales.yml).
#
# Ningún paso lanza otra corrida: lo que tiene que correr después se pide en
# una salida `pedir_*` del job y lo lanza el supervisor (OpenCodice/supervisor),
# que también lanza esta ronda cada miércoles.
#
# Un estado por ronda, y solo cuando la cadena anterior terminó: ninguna
# vigilar-leyes-estatales en curso ni PR suyo abierto, ni leyes declaradas sin
# alta todavía (en ese caso pide la vigilancia de esos estados y el estado
# nuevo espera a la siguiente ronda). El supervisor no la lanza por horario
# mientras la cadena siga ocupada: la lanza en cuanto queda libre. Falla cerrado: un error deja todo sin
# publicar y el estado se reintenta en la ronda siguiente, hasta el tope de
# intentos de la lista.
#
# Lo que el agente no puede resolver con un módulo tampoco espera a nadie: si
# el sitio rechaza IP extranjeras, un paso determinista agrega su dominio (si
# es oficial) a la lista de egress-mx; si al extractor le falta una opción para
# encontrar o descargar los PDF, el job `codigo` la agrega (otro agente, con
# compuertas). En los dos casos el estado vuelve a la cola sin gastar el
# intento y se pide otra ronda para él.
#
# Con `redeclarar=<estado>` (lo pide el job `reparar` de
# vigilar-leyes-estatales.yml) la ronda es sobre un estado ya publicado: leyes
# de su FUERA que no se pueden descargar por algo del extractor. El agente solo
# agrega opciones a esas entradas del módulo (cerco por a_dict: LEYES y
# FUERA_POR_DISENO idénticas); si falta la opción, el mismo job `codigo` la
# agrega y la redeclaración se pide otra vez. Con su propio tope por estado y falla
# (registro `redeclaracion` de pendientes.json). No espera a la cadena: no
# suma ningún estado.

on:
  workflow_dispatch:
    inputs:
      estado:
        description: 'Este estado (slug de pendientes.json) en vez del siguiente de la lista'
        required: false
        default: ''
      sin_esperar:
        description: 'Prueba manual: no esperar a que termine la cadena de vigilancias (ni a sus altas pendientes)'
        type: boolean
        default: false
      ensayo:
        description: 'Prueba manual: hace todo pero no sube nada (ni el intento, ni el módulo, ni el arreglo, ni egress-mx) ni pide otra corrida'
        type: boolean
        default: false
      simular:
        description: 'Solo con ensayo: en vez del agente de la ronda, este veredicto (codigo o egress)'
        type: choice
        options: ['', codigo, egress]
        default: ''
      simular_texto:
        description: 'Con simular: lo que falta al extractor (codigo) o el dominio (egress)'
        required: false
        default: ''
      redeclarar:
        description: 'Estado ya publicado cuyas leyes de FUERA no se descargan por algo del extractor (lo pide reparar)'
        required: false
        default: ''
      origen:
        description: 'Quién lanzó la corrida (supervisor); vacío = a mano'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: expandir-estatales
  cancel-in-progress: false

env:
  EXTRACTOR_REPO: https://github.com/OpenCodice/fiscal-extractor.git
  DATOS: OpenCodice/leyes-estatales
  RAMA: reforma/leyes-estatales
  TRABAJO: /tmp/expansion
  PDF_CACHE: /tmp/pdfs-corpus
  REDECLARAR: ${{ inputs.redeclarar != '' && 'true' || 'false' }}
  REDECLARAR_ESTADO: ${{ inputs.redeclarar }}

jobs:
  ronda:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      # `gh run list` de la vigilancia, para saber si la cadena terminó.
      actions: read
    env:
      TIENE_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      ENSAYO: ${{ inputs.ensayo || inputs.simular != '' }}
    outputs:
      codigo: ${{ steps.anotar.outputs.codigo }}
      estado: ${{ steps.elegir.outputs.estado }}
      nombre: ${{ steps.elegir.outputs.nombre }}
      pedir_altas: ${{ steps.retomar.outputs.pedir }}
      pedir_vigilancia: ${{ steps.vigilancia.outputs.pedir }}
      pedir_ronda: ${{ steps.anotar.outputs.pedir }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: ¿Terminó la cadena anterior?
        # Salvaguarda: el supervisor no lanza la ronda por horario mientras la
        # cadena siga ocupada. Si aun así lo está (una ronda a mano, una
        # vigilancia que empezó a la vez), esta corrida no empieza un estado.
        id: cadena
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          corriendo=$(gh run list -R "$GITHUB_REPOSITORY" -w vigilar-leyes-estatales.yml -L 20 \
                        --json status -q '[.[] | select(.status != "completed")] | length')
          abiertos=$(gh pr list -R "$DATOS" --head "$RAMA" --state open --json number -q length)
          echo "Vigilancias en curso: $corriendo; PR abiertos: $abiertos"
          if [ "$REDECLARAR" = true ]; then
            echo "Redeclaración de $REDECLARAR_ESTADO: no suma un estado, no espera a la cadena." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "libre=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.sin_esperar }}" = true ]; then
            echo "Prueba manual (sin_esperar): no se espera a la cadena anterior." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "libre=true" >> "$GITHUB_OUTPUT"
          elif [ "$corriendo" != 0 ] || [ "$abiertos" != 0 ]; then
            echo "La cadena anterior sigue en curso: esta ronda no empieza un estado nuevo." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "libre=false" >> "$GITHUB_OUTPUT"
          else
            echo "libre=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clonar extractor y leyes-estatales
        if: steps.cadena.outputs.libre == 'true'
        id: extractor
        run: |
          git clone -q "$EXTRACTOR_REPO" /tmp/extractor
          git clone -q --depth 1 --filter=blob:none --sparse "https://github.com/$DATOS.git" /tmp/datos
          pip install -q -r /tmp/extractor/requirements.txt pytest

      - name: Altas pendientes
        if: steps.cadena.outputs.libre == 'true' && inputs.redeclarar == ''
        id: altas
        env:
          EGRESS_MX_TOKEN: ${{ secrets.EGRESS_MX_TOKEN }}
        run: python /tmp/extractor/scripts/expansion.py listo --out /tmp/datos

      - name: Retomar la cadena
        # Quedan leyes declaradas sin alta (una tanda que no continuó): se
        # pide su vigilancia y el estado nuevo espera a la siguiente ronda.
        id: retomar
        if: steps.altas.outputs.pendientes != '' && steps.altas.outputs.pendientes != '0' && !inputs.sin_esperar
        env:
          ESTADOS: ${{ steps.altas.outputs.estados }}
        run: |
          echo "pedir=$(jq -cn --arg e "$ESTADOS" '{workflow: "vigilar-leyes-estatales.yml", inputs: {estados: $e}}')" >> "$GITHUB_OUTPUT"
          echo "Quedan altas pendientes en: $ESTADOS. Se pidió su vigilancia; el estado nuevo espera a la siguiente ronda." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Redeclaración — qué leyes de FUERA no se descargan y por qué
        # Con el extractor de main, antes del agente (con EGRESS_MX_TOKEN, que
        # el agente no tiene): las que fallan por algo del extractor son su
        # objetivo; su registro es la referencia del cerco.
        id: fuera
        if: steps.cadena.outputs.libre == 'true' && inputs.redeclarar != '' && env.TIENE_CLAUDE == 'true'
        timeout-minutes: 30
        env:
          EGRESS_MX_TOKEN: ${{ secrets.EGRESS_MX_TOKEN }}
        run: |
          cd /tmp/extractor
          python scripts/reparacion.py fuera --trabajo "$TRABAJO" --pdfs "$TRABAJO/fuera-pdfs" \
            --salida "$TRABAJO/fuera.json" --estado "$REDECLARAR_ESTADO" --solo-fuente
          python scripts/expansion.py registro --estado "$REDECLARAR_ESTADO" --salida "$TRABAJO/registro-antes.json"

      - name: Elegir el estado y contar el intento
        id: elegir
        if: ((inputs.redeclarar == '' && (steps.altas.outputs.pendientes == '0' || (inputs.sin_esperar && steps.altas.outputs.pendientes != ''))) || steps.fuera.outcome == 'success') && env.TIENE_CLAUDE == 'true'
        env:
          ESTADO_PEDIDO: ${{ inputs.estado }}
          EXTRACTOR_TOKEN: ${{ secrets.PR_TOKEN }}
          EXTRACTOR_SLUG: OpenCodice/fiscal-extractor
          GH_TOKEN: ${{ github.token }}
        run: |
          # La lista que lee el Worker egress-mx, por la API (raw.githubusercontent
          # la sirve con minutos de caché y un dominio recién agregado no se vería).
          gh api -H 'Accept: application/vnd.github.raw' \
              repos/OpenCodice/constitucion-extractor/contents/egress-mx/permitidos.json \
              > /tmp/egress-permitidos.json \
            || echo "::warning::No se pudo leer la lista de dominios de egress-mx."
          cd /tmp/extractor
          if [ "$REDECLARAR" = true ]; then
            python scripts/expansion.py elegir --redeclarar "$REDECLARAR_ESTADO" --fuera "$TRABAJO/fuera.json" \
              --objetivo "$TRABAJO/redeclarar.json" --permitidos /tmp/egress-permitidos.json
          else
            python scripts/expansion.py elegir --estado "$ESTADO_PEDIDO" --permitidos /tmp/egress-permitidos.json
          fi
          estado=$(grep '^estado=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          [ -n "$estado" ] || exit 0
          NOMBRE="$(grep '^nombre=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)" ESTADO="$estado" \
            bash scripts/agente/expandir.sh intento
          echo "partida=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Lo que el cerco de una redeclaración compara no puede cambiar durante el agente.
          [ "$REDECLARAR" != true ] || echo "huella_antes=$(cat "$TRABAJO/registro-antes.json" "$TRABAJO/redeclarar.json" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "pista_url=$(grep '^pista=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      - name: Caché de los PDF publicados
        if: steps.elegir.outputs.hay == 'true'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/pdfs-corpus
          key: pdfs-corpus-${{ github.run_id }}-${{ github.run_attempt }}-ronda
          restore-keys: pdfs-corpus-

      - name: PDF de lo publicado y medición sin el módulo
        # Antes del agente y con el extractor de partida: la caché de PDF (con
        # EGRESS_MX_TOKEN) y el impacto que ya tiene main sin el módulo nuevo,
        # para compararlo después con el impacto que tenga con él.
        id: pdfs
        if: steps.elegir.outputs.hay == 'true'
        timeout-minutes: 60
        env:
          EGRESS_MX_TOKEN: ${{ secrets.EGRESS_MX_TOKEN }}
        run: |
          cd /tmp/extractor
          python scripts/impacto_corpus.py --solo-pdfs --trabajo "$TRABAJO/pdfs" --cache "$PDF_CACHE"

      - name: Guardar la caché de los PDF publicados
        # Antes del agente: lo que falle después no obliga a descargarlos otra vez.
        if: always() && steps.pdfs.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: /tmp/pdfs-corpus
          key: pdfs-corpus-${{ github.run_id }}-${{ github.run_attempt }}-ronda

      - name: Puerta local hacia egress-mx
        # El agente no recibe EGRESS_MX_TOKEN: si el sitio del estado está en
        # la lista del Worker, descarga por esta puerta, que lee el token de un
        # archivo que borra al arrancar.
        if: steps.elegir.outputs.hay == 'true'
        env:
          EGRESS_MX_TOKEN: ${{ secrets.EGRESS_MX_TOKEN }}
        run: |
          [ -n "$EGRESS_MX_TOKEN" ] || exit 0
          umask 077
          printf '%s' "$EGRESS_MX_TOKEN" > /tmp/egress-token
          env -u EGRESS_MX_TOKEN nohup python3 -I /tmp/extractor/scripts/agente/proxy_mx.py /tmp/egress-token 8765 \
            > /tmp/proxy-mx.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w 'puerta: %{http_code}\n' "http://127.0.0.1:8765/?url=https%3A%2F%2Fwww.congresogto.gob.mx%2F" || true

      - name: Veredicto simulado (ensayo)
        if: steps.elegir.outputs.hay == 'true' && inputs.simular != ''
        env:
          SIMULAR: ${{ inputs.simular }}
          TEXTO: ${{ inputs.simular_texto }}
        run: |
          mkdir -p "$TRABAJO"
          python3 - "$TRABAJO/veredicto.json" <<'PY'
          import json, os, sys
          s, t = os.environ["SIMULAR"], os.environ["TEXTO"]
          v = ({"resultado": "codigo", "falta": t, "motivo": "ensayo: veredicto simulado"} if s == "codigo"
               else {"resultado": "egress", "dominio": t, "motivo": "ensayo: veredicto simulado"})
          json.dump(v, open(sys.argv[1], "w", encoding="utf-8"), ensure_ascii=False)
          PY
          echo "Ensayo: veredicto simulado $SIMULAR ($TEXTO), sin agente." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Agente — escribir el módulo del estado
        if: steps.elegir.outputs.hay == 'true' && inputs.simular == ''
        timeout-minutes: 160
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ESTADO: ${{ steps.elegir.outputs.estado }}
          NOMBRE: ${{ steps.elegir.outputs.nombre }}
          MODULO: ${{ steps.elegir.outputs.modulo }}
          PISTA: ${{ steps.elegir.outputs.pista }}
          PERMITIDOS: ${{ steps.elegir.outputs.permitidos }}
          PROXY_MX: http://127.0.0.1:8765
        run: bash /tmp/extractor/scripts/agente/expandir.sh agente

      - name: Lo que el agente no puede tocar
        # Fuera de su alcance: solo cuentan su módulo y sus pruebas nuevas. Si
        # hizo commits o tocó cualquier otra cosa, se deshace todo y no se
        # publica nada.
        id: cerco
        if: steps.elegir.outputs.hay == 'true'
        env:
          PARTIDA: ${{ steps.elegir.outputs.partida }}
          MODULO: ${{ steps.elegir.outputs.modulo }}
          HUELLA_ANTES: ${{ steps.elegir.outputs.huella_antes }}
        run: |
          pkill -f proxy_mx.py || true
          cd /tmp/extractor
          fuera=""
          [ "$(git rev-parse HEAD)" = "$PARTIDA" ] || fuera="commits propios en el extractor"
          if [ "$REDECLARAR" = true ]; then
            # Redeclaración: solo el módulo que ya existe.
            otros=$(git status --porcelain=v1 -uall --no-renames | grep -vE "^ M extractor/estatales/${MODULO}\.py$" || true)
            [ "$(cat "$TRABAJO/registro-antes.json" "$TRABAJO/redeclarar.json" | sha256sum | cut -d' ' -f1)" = "$HUELLA_ANTES" ] \
              || fuera="cambió lo que el cerco compara (registro-antes.json o redeclarar.json)"
          else
            otros=$(git status --porcelain=v1 -uall --no-renames | grep -vE "^\?\? (extractor/estatales/${MODULO}\.py|tests/test_estatal_${MODULO}[a-z0-9_]*\.py)$" || true)
          fi
          [ -z "$otros" ] || fuera="tocó otros archivos: $(echo "$otros" | head -3 | tr '\n' ' ')"
          if [ -n "$fuera" ]; then
            echo "::error::El agente $fuera"
            git reset -q --hard "$PARTIDA"; git clean -fdq
            echo "motivo=el agente $fuera" >> "$GITHUB_OUTPUT"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - "$TRABAJO/veredicto.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          try:
              v = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              v = {}
          r = v.get("resultado") if v.get("resultado") in ("modulo", "egress", "codigo", "sin-fuente") else "ninguno"
          dominio = str(v.get("dominio") or "").strip().lower()
          dominio = dominio if re.fullmatch(r"[a-z0-9.-]+\.[a-z]{2,}", dominio) else ""
          motivo = " ".join(str(v.get("falta" if r == "codigo" else "motivo") or v.get("motivo") or "").split())[:300]
          print(f"resultado={r}\ndominio={dominio}\nmotivo={motivo}\nok=true")
          PY
          # El borrador de un veredicto `codigo` es el ejemplo del agente de código.
          mkdir -p "$TRABAJO/borrador"
          cp extractor/estatales/${MODULO}.py tests/test_estatal_${MODULO}*.py "$TRABAJO/borrador/" 2>/dev/null || true

      - name: Compuertas — forma del módulo y pruebas
        id: forma
        if: steps.cerco.outputs.ok == 'true' && steps.cerco.outputs.resultado == 'modulo'
        env:
          ESTADO: ${{ steps.elegir.outputs.estado }}
          MODULO: ${{ steps.elegir.outputs.modulo }}
        run: |
          cd /tmp/extractor
          test -f "extractor/estatales/$MODULO.py" || { echo "::error::No hay módulo."; exit 1; }
          if [ "$REDECLARAR" != true ]; then
            ls tests/test_estatal_${MODULO}*.py > /dev/null 2>&1 \
              && grep -qE '^def test_' tests/test_estatal_${MODULO}*.py \
              || { echo "::error::No hay pruebas nuevas."; exit 1; }
          fi
          EXPANSION_ESTADO="$ESTADO" python -m pytest -q > "$TRABAJO/pytest.log" 2>&1 || { tail -n 40 "$TRABAJO/pytest.log"; exit 1; }
          tail -n 1 "$TRABAJO/pytest.log"
          python scripts/expansion.py registro --estado "$ESTADO" --salida "$TRABAJO/registro.json"
          if [ "$REDECLARAR" = true ]; then
            # Solo opciones nuevas en las leyes por redeclarar; se descargan
            # (y solo ellas) en el paso siguiente.
            python3 -I -S /tmp/extractor/scripts/expansion.py redeclaracion-cerco --antes "$TRABAJO/registro-antes.json" \
              --despues "$TRABAJO/registro.json" --objetivo "$TRABAJO/redeclarar.json" --salida "$TRABAJO/registro-objetivo.json"
            echo "registro=$TRABAJO/registro-objetivo.json" >> "$GITHUB_OUTPUT"
          else
            echo "registro=$TRABAJO/registro.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Compuertas — descargar cada PDF desde un clon limpio
        # Con EGRESS_MX_TOKEN, así que no importa nada del agente: lee su
        # registro como datos con el extractor de partida.
        if: steps.forma.outcome == 'success'
        env:
          EGRESS_MX_TOKEN: ${{ secrets.EGRESS_MX_TOKEN }}
          PARTIDA: ${{ steps.elegir.outputs.partida }}
        run: |
          git clone -q "$EXTRACTOR_REPO" /tmp/limpio
          git -C /tmp/limpio checkout -q "$PARTIDA"
          python3 -I -S /tmp/limpio/scripts/expansion.py descargar --registro "${{ steps.forma.outputs.registro }}" \
            --pdfs "$TRABAJO/pdfs-estado" --resultado "$TRABAJO/descargas.json"

      - name: Compuertas — cada ley redeclarada se descarga
        # Su build y auditar los hace la reparación autónoma (reparacion.py
        # fuera) en la vigilancia siguiente, que las promueve si quedan limpias.
        id: descargadas
        if: steps.forma.outcome == 'success' && inputs.redeclarar != ''
        run: |
          python3 -I -S - "$TRABAJO/descargas.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          malas = {c: r["error"] for c, r in d.items() if "error" in r}
          for c, e in malas.items():
              print(f"::error::{c} sigue sin descargarse: {e}")
          sys.exit(1 if malas or not d else 0)
          PY

      - name: Compuertas — build y auditar; lo que no quede limpio, a FUERA
        id: construir
        if: steps.forma.outcome == 'success' && inputs.redeclarar == ''
        env:
          ESTADO: ${{ steps.elegir.outputs.estado }}
        run: |
          cd /tmp/extractor
          if python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if any("error" in r for r in d.values()) else 1)' "$TRABAJO/descargas.json"; then
            # Una descarga que falla es un error de la ronda, no de la ley:
            # no se publica nada y el estado se reintenta.
            echo "::error::No se pudieron descargar todos los PDF."; exit 1
          fi
          python scripts/expansion.py construir --registro "$TRABAJO/registro.json" \
            --pdfs "$TRABAJO/pdfs-estado" --descargas "$TRABAJO/descargas.json" --out "$TRABAJO/construccion"
          python scripts/expansion.py fuera --estado "$ESTADO" --construccion "$TRABAJO/construccion/resultado.json"
          limpias=$(grep '^limpias=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          [ "${limpias:-0}" -gt 0 ] || { echo "::error::Ninguna ley quedó limpia."; exit 1; }
          python scripts/expansion.py registro --estado "$ESTADO" --salida "$TRABAJO/registro-final.json"
          EXPANSION_ESTADO="$ESTADO" python -m pytest -q > "$TRABAJO/pytest.log" 2>&1 || { tail -n 40 "$TRABAJO/pytest.log"; exit 1; }

      - name: Compuertas — nada de lo publicado cambia
        # Reconstruye todo lo publicado (fiscal, federal y estatal) con el
        # extractor y el módulo nuevo. Sin cambios, pasa. Si hay alguno (p. ej.
        # una corrección de main aún sin confirmar), tiene que ser idéntico a lo
        # que cambia sin el módulo.
        id: impacto
        if: steps.construir.outcome == 'success' || steps.descargadas.outcome == 'success'
        timeout-minutes: 120
        env:
          PARTIDA: ${{ steps.elegir.outputs.partida }}
        run: bash /tmp/extractor/scripts/agente/expandir.sh impacto /tmp/limpio

      - name: Publicar el módulo
        id: publicar
        if: steps.impacto.outcome == 'success'
        env:
          EXTRACTOR_TOKEN: ${{ secrets.PR_TOKEN }}
          EXTRACTOR_SLUG: OpenCodice/fiscal-extractor
          ESTADO: ${{ steps.elegir.outputs.estado }}
          NOMBRE: ${{ steps.elegir.outputs.nombre }}
          MODULO: ${{ steps.elegir.outputs.modulo }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LIMPIAS: ${{ steps.construir.outputs.limpias }}
          FUERA: ${{ steps.construir.outputs.fuera }}
        run: |
          bash /tmp/extractor/scripts/agente/expandir.sh publicar --leyes "$LIMPIAS" --fuera "${FUERA:-0}" --corrida "$CORRIDA"
          echo "sha=$(cat "$TRABAJO/publicado.txt")" >> "$GITHUB_OUTPUT"

      - name: Pedir la vigilancia del estado nuevo
        id: vigilancia
        if: steps.publicar.outcome == 'success' && env.ENSAYO != 'true'
        env:
          ESTADO: ${{ steps.elegir.outputs.estado }}
        run: |
          echo "pedir=$(jq -cn --arg e "$ESTADO" '{workflow: "vigilar-leyes-estatales.yml", inputs: {estados: $e}}')" >> "$GITHUB_OUTPUT"
          echo "Módulo de $ESTADO publicado (${{ steps.publicar.outputs.sha }}); vigilancia pedida." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Anotar el resultado sin módulo
        # Egress: el sitio rechaza IP extranjeras y su dominio no está en el
        # Worker; solo se acepta si desde aquí de verdad no responde (dos
        # veces), y si el dominio es oficial se agrega solo a la lista del
        # Worker y se pide otra ronda para el estado. Código: al extractor le falta una opción
        # para encontrar o descargar los PDF; la agrega el job `codigo`. Lo demás
        # (sin fuente, sin veredicto, una compuerta que falló) es un intento
        # fallido: el estado se reintenta hasta el tope.
        id: anotar
        if: always() && steps.elegir.outputs.hay == 'true' && steps.publicar.outcome != 'success'
        env:
          EXTRACTOR_TOKEN: ${{ secrets.PR_TOKEN }}
          EXTRACTOR_SLUG: OpenCodice/fiscal-extractor
          ESTADO: ${{ steps.elegir.outputs.estado }}
          NOMBRE: ${{ steps.elegir.outputs.nombre }}
          PISTA: ${{ steps.elegir.outputs.pista }}
          RESULTADO: ${{ steps.cerco.outputs.resultado }}
          DOMINIO: ${{ steps.cerco.outputs.dominio }}
          MOTIVO: ${{ steps.cerco.outputs.motivo }}
          PERMITIDOS: ${{ steps.elegir.outputs.permitidos }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PASOS: >-
            cerco=${{ steps.cerco.outcome }}/${{ steps.cerco.outputs.ok }}
            forma=${{ steps.forma.outcome }} construir=${{ steps.construir.outcome }}
            impacto=${{ steps.impacto.outcome }} publicar=${{ steps.publicar.outcome }}
        run: |
          expandir() { bash /tmp/extractor/scripts/agente/expandir.sh "$@"; }
          # En una redeclaración un sitio que rechaza IP extranjeras no es causa
          # `codigo` (reparacion.causa_fuente): ese veredicto es un intento fallido.
          if [ "$REDECLARAR" != true ] && [ "$RESULTADO" = egress ] && [ -n "$DOMINIO" ] && ! echo " $PERMITIDOS " | grep -qF " $DOMINIO "; then
            responde=""
            for _ in 1 2; do
              code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "https://$DOMINIO/" || true)
              if [ "${code:0:1}" = 2 ] || [ "${code:0:1}" = 3 ]; then responde="$code"; break; fi
              sleep 20
            done
            if [ -z "$responde" ]; then
              expandir egress "$DOMINIO" && rc=0 || rc=$?
              if [ "$rc" = 0 ]; then
                expandir anotar --resultado egress --agregado --dominio "$DOMINIO" --motivo "$MOTIVO" --corrida "$CORRIDA"
                if [ "$ENSAYO" != true ]; then
                  # `expandir egress` ya esperó a que la lista nueva se vea
                  # donde la lee el Worker: la ronda pedida puede empezar.
                  echo "pedir=$(jq -cn --arg e "$ESTADO" '{workflow: "expandir-estatales.yml", inputs: {estado: $e}}')" >> "$GITHUB_OUTPUT"
                  echo "$DOMINIO agregado a egress-mx; ronda pedida para $ESTADO." | tee -a "$GITHUB_STEP_SUMMARY"
                else
                  echo "Ensayo: $DOMINIO se agregaría a egress-mx y se pediría la ronda para $ESTADO." | tee -a "$GITHUB_STEP_SUMMARY"
                fi
                exit 0
              elif [ "$rc" = 3 ]; then
                MOTIVO="$DOMINIO rechaza IP extranjeras, pero no es un dominio oficial que egress-mx admita solo (.gob.mx, o .mx del mismo dominio que la constitución del estado)"
              else
                MOTIVO="$DOMINIO rechaza IP extranjeras y no se pudo agregar a egress-mx"
              fi
            else
              MOTIVO="el agente dijo que $DOMINIO rechaza IP extranjeras, pero responde $responde desde Actions"
            fi
            RESULTADO=fallido
          fi
          if [ "$RESULTADO" = codigo ] && [ "${{ steps.cerco.outputs.ok }}" = true ]; then
            expandir anotar --resultado codigo --motivo "$MOTIVO" --corrida "$CORRIDA"
            exit 0
          fi
          case "$RESULTADO" in
            sin-fuente) motivo="sin fuente: $MOTIVO" ;;
            modulo) motivo="no pasó las compuertas ($PASOS)" ;;
            *) motivo="${MOTIVO:-el agente no entregó veredicto} ($PASOS)" ;;
          esac
          expandir anotar --resultado fallido --motivo "$motivo" --corrida "$CORRIDA"

      - name: Guardar el trabajo de la ronda
        if: always() && steps.elegir.outputs.hay == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: expansion
          path: |
            /tmp/expansion/*.json
            /tmp/expansion/*.md
            /tmp/expansion/*.log
            /tmp/expansion/*.err
            /tmp/expansion/*.patch
            /tmp/expansion/borrador/*.py
            /tmp/expansion/construccion/*.json
            /tmp/expansion/impacto-*/resumen.json
            /tmp/expansion/impacto-*/cambios.json
            /tmp/extractor/extractor/estatales/*.py
            /tmp/extractor/tests/test_estatal_*.py
          retention-days: 30

  codigo:
    # Al extractor le falta una opción para encontrar o descargar los PDF del
    # estado (veredicto `codigo`; el intento de código ya se contó en
    # pendientes.json). Mismo cerco que `reparar` de las vigilancias: un agente
    # la agrega solo en fuentes.py, registro.py y estatales/__init__.py, con una
    # prueba nueva; código determinista decide si entra: pruebas, ninguna
    # declaración ni URL vigente de lo ya declarado distinta (sobre las mismas
    # páginas índice) e impacto nulo en lo publicado. El parser no: eso es de
    # `reparar`. Si entra, se publica en main, el estado vuelve a la cola sin
    # gastar el intento y se pide otra ronda para él.
    needs: ronda
    if: ${{ always() && needs.ronda.outputs.codigo == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
    outputs:
      pedir_ronda: ${{ steps.reintentar.outputs.pedir }}
    env:
      ENSAYO: ${{ inputs.ensayo || inputs.simular != '' }}
      ESTADO: ${{ needs.ronda.outputs.estado }}
      NOMBRE: ${{ needs.ronda.outputs.nombre }}
      FUENTES: /tmp/fuentes/leyes-estatales.json /tmp/fuentes/leyes-federales.json
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Clonar extractor y lo que dejó la ronda
        id: extractor
        run: |
          git clone -q "$EXTRACTOR_REPO" /tmp/extractor
          partida=$(git -C /tmp/extractor rev-parse HEAD)
          git clone -q "$EXTRACTOR_REPO" /tmp/limpio
          git -C /tmp/limpio checkout -q "$partida"
          pip install -q -r /tmp/extractor/requirements.txt pytest
          mkdir -p /tmp/fuentes
          for r in leyes-estatales leyes-federales; do
            curl -fsSL -o "/tmp/fuentes/$r.json" "https://raw.githubusercontent.com/OpenCodice/$r/main/fuentes.json"
          done
          echo "partida=$partida" >> "$GITHUB_OUTPUT"

      - name: Veredicto y borrador de la ronda
        uses: actions/download-artifact@v4
        with:
          name: expansion
          path: /tmp/ronda

      - name: Caché de los PDF publicados
        uses: actions/cache/restore@v4
        with:
          path: /tmp/pdfs-corpus
          key: pdfs-corpus-${{ github.run_id }}-${{ github.run_attempt }}-codigo
          restore-keys: pdfs-corpus-

      - name: Lo ya declarado, con el extractor de partida
        # Con EGRESS_MX_TOKEN y desde el clon limpio (python -I -S): cada
        # declaración, su URL vigente y las páginas índice de las que sale, que
        # las compuertas vuelven a leer con el arreglo, sin red. También los
        # PDF de lo publicado, para medir el impacto.
        id: antes
        timeout-minutes: 60
        env:
          EGRESS_MX_TOKEN: ${{ secrets.EGRESS_MX_TOKEN }}
        run: |
          mkdir -p "$TRABAJO/codigo" "$TRABAJO/borrador"
          cp /tmp/ronda/expansion/veredicto.json "$TRABAJO/veredicto.json"
          cp /tmp/ronda/expansion/borrador/* "$TRABAJO/borrador/" 2>/dev/null || true
          # shellcheck disable=SC2046
          python3 -I -S /tmp/limpio/scripts/expansion.py declaraciones \
            --salida "$TRABAJO/codigo/declaraciones-antes.json" --indices "$TRABAJO/codigo/indices.json" \
            $(for f in $FUENTES; do echo --fuentes "$f"; done)
          (cd /tmp/limpio && python scripts/impacto_corpus.py --solo-pdfs --trabajo "$TRABAJO/pdfs" --cache "$PDF_CACHE")
          echo "huellas=$(cat "$TRABAJO/codigo/declaraciones-antes.json" "$TRABAJO/codigo/indices.json" $FUENTES | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Guardar la caché de los PDF publicados
        # Antes del agente: lo que falle después no obliga a descargarlos otra vez.
        if: always() && steps.antes.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: /tmp/pdfs-corpus
          key: pdfs-corpus-${{ github.run_id }}-${{ github.run_attempt }}-codigo

      - name: Agente — agregar la opción al extractor
        timeout-minutes: 160
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash /tmp/extractor/scripts/agente/expandir.sh codigo-agente

      - name: Lo que el agente no puede tocar
        # Fuera de su alcance: solo cuentan fuentes.py, registro.py,
        # estatales/__init__.py y pruebas nuevas tests/test_expansion_<tema>.py.
        # Si hizo commits o tocó otra cosa, se deshace todo. Lo que dejó el
        # extractor de partida para comparar tampoco puede cambiar.
        id: cerco
        env:
          PARTIDA: ${{ steps.extractor.outputs.partida }}
          HUELLAS: ${{ steps.antes.outputs.huellas }}
        run: |
          cd /tmp/extractor
          fuera=""
          [ "$(git rev-parse HEAD)" = "$PARTIDA" ] || fuera="commits propios en el extractor"
          otros=$(git status --porcelain=v1 -uall --no-renames \
                    | grep -vE '^( M|M |MM) (extractor/fuentes\.py|extractor/registro\.py|extractor/estatales/__init__\.py)$' \
                    | grep -vE '^\?\? tests/test_expansion_[a-z0-9_]+\.py$' || true)
          [ -z "$otros" ] || fuera="tocó otros archivos: $(echo "$otros" | head -3 | tr '\n' ' ')"
          [ "$(cat "$TRABAJO/codigo/declaraciones-antes.json" "$TRABAJO/codigo/indices.json" $FUENTES | sha256sum | cut -d' ' -f1)" = "$HUELLAS" ] \
            || fuera="cambió lo que dejó el extractor de partida para comparar"
          if [ -n "$fuera" ]; then
            echo "::error::El agente $fuera"
            git reset -q --hard "$PARTIDA"; git clean -fdq
            echo "el agente $fuera" > "$TRABAJO/codigo/fuera.txt"
          fi
          git status --short

      - name: Compuertas del arreglo
        # Sin secretos.
        run: |
          if [ -s "$TRABAJO/codigo/fuera.txt" ]; then
            mkdir -p "$TRABAJO/codigo"; cp "$TRABAJO/codigo/fuera.txt" "$TRABAJO/codigo/descarte.txt"
            echo descartado > "$TRABAJO/codigo/estado.txt"
            exit 0
          fi
          bash /tmp/extractor/scripts/agente/expandir.sh codigo-compuertas /tmp/limpio
          echo "Compuertas: $(cat "$TRABAJO/codigo/estado.txt") $(cat "$TRABAJO/codigo/descarte.txt" 2>/dev/null)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publicar el arreglo o anotar el descarte
        id: publicar
        if: ${{ !cancelled() }}
        env:
          EXTRACTOR_TOKEN: ${{ secrets.PR_TOKEN }}
          EXTRACTOR_SLUG: OpenCodice/fiscal-extractor
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash /tmp/limpio/scripts/agente/expandir.sh codigo-publicar

      - name: Reintentar el estado con el extractor nuevo
        # Pide otra ronda para el estado (o su redeclaración).
        id: reintentar
        if: steps.publicar.outputs.publicado == 'true' && env.ENSAYO != 'true'
        run: |
          if [ "$REDECLARAR" = true ]; then clave=redeclarar; else clave=estado; fi
          echo "pedir=$(jq -cn --arg k "$clave" --arg e "$ESTADO" '{workflow: "expandir-estatales.yml", inputs: {($k): $e}}')" >> "$GITHUB_OUTPUT"
          echo "Arreglo publicado ($(cat "$TRABAJO/codigo/publicado.txt")); ronda pedida ($clave=$ESTADO)." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guardar el trabajo del arreglo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codigo
          path: |
            /tmp/expansion/codigo/*.json
            /tmp/expansion/codigo/*.md
            /tmp/expansion/codigo/*.txt
            /tmp/expansion/codigo/*.log
            /tmp/expansion/codigo/*.err
            /tmp/expansion/codigo/*.patch
            /tmp/expansion/impacto-*/resumen.json
            /tmp/expansion/impacto-*/cambios.json
          retention-days: 30

  estado:
    # El supervisor (OpenCodice/supervisor) lee el nombre de este job para
    # saber si quedó otra tanda (una ronda nunca deja una), y el artefacto
    # `cadena` (el resultado y las salidas de cada job) para atender lo que
    # pidieron (salidas `pedir*`).
    name: "estado pendiente=[false]"
    needs: [ronda, codigo]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Lo que declaró cada job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS" > cadena.json
      - uses: actions/upload-artifact@v4
        with:
          name: cadena
          path: cadena.json
          retention-days: 14
