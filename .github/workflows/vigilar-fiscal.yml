name: Vigilar corpus fiscal
run-name: "vigilar-fiscal origen=[${{ inputs.origen }}]"

# Vigila las fuentes oficiales del corpus fiscal (Cámara de Diputados para leyes,
# códigos y reglamentos; SAT para la RMF y los criterios) y abre un PR cuando el
# texto vigente cambia. La detección la hace git: se reconstruye el repo y se
# compara; NO se comparan bytes de los PDF.
#
# El PR trae solo texto + metadata (reconstrucción determinista y gratuita).
# El validador corre como gate: si los invariantes fallan, no se abre PR.
#
# Vive en el extractor, no en el repo de datos, para que el historial de
# fiscal-mexicano solo tenga cambios de texto legal. Lo lanza cada lunes el
# supervisor (OpenCodice/supervisor), que también lo reintenta si falla y
# redespliega la web cuando los datos cambian; el PR se abre en fiscal-mexicano
# con PR_TOKEN, un commit por documento, y el job `revisar` (revisar-pr.yml) lo
# valida y lo fusiona con rebase para conservarlos.

on:
  workflow_dispatch:
    inputs:
      origen:
        description: 'Quién lanzó la corrida (supervisor); vacío = a mano'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

env:
  TIENE_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
  # Repo del extractor (código). Ajusta si el owner/nombre difiere.
  EXTRACTOR_REPO: https://github.com/OpenCodice/fiscal-extractor.git

# Una corrida a la vez (la del supervisor y una a mano pueden
# coincidir); la siguiente espera en cola.
concurrency:
  group: vigilar-fiscal-mexicano
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    # Los tres agentes del job, juntos, dejan tiempo para reconstruir el corpus
    # y medir el impacto de un arreglo.
    timeout-minutes: 355
    outputs:
      pr: ${{ steps.pr.outputs.pull-request-number }}
    steps:
      - name: Checkout del repo de datos
        uses: actions/checkout@v5
        with:
          repository: OpenCodice/fiscal-mexicano
          token: ${{ secrets.PR_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Clonar extractor e instalar dependencias
        # Con historia: separar una reforma de una corrección reconstruye el PDF
        # nuevo con el commit del extractor que produjo la versión publicada.
        run: |
          git clone -q "$EXTRACTOR_REPO" /tmp/extractor
          pip install -r /tmp/extractor/requirements.txt

      - name: Descargar fuentes y reconstruir el corpus
        id: reconstruir
        # Exit 3 = alguna fuente no se pudo resolver/descargar pero el resto sí
        # se reconstruyó: se sigue (el PR de lo que sí cambió vale) y el paso
        # final pone el job en rojo para que el fallo no pase inadvertido.
        run: |
          cd /tmp/extractor
          set +e
          PYTHONPATH=/tmp/extractor python -m extractor actualizar \
            --out "$GITHUB_WORKSPACE" --pdf-dir /tmp/pdfs
          code=$?
          if [ "$code" -eq 3 ]; then
            echo "fuentes_fallidas=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Agente — verificar contra el PDF y reparar el extractor si hace falta
        timeout-minutes: 90
        if: env.TIENE_CLAUDE == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OUT: ${{ github.workspace }}
          PDF_DIR: /tmp/pdfs
        run: bash /tmp/extractor/scripts/agente/correr.sh

      - name: Caché de los PDF publicados
        # Medir el impacto de un arreglo reconstruye todo lo publicado desde su
        # PDF exacto (scripts/impacto_corpus.py); los ya descargados se guardan.
        uses: actions/cache/restore@v4
        with:
          path: /tmp/pdfs-corpus
          key: pdfs-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pdfs-corpus-

      - name: Compuertas del arreglo del agente
        # Sin secretos: pruebas, cobertura e impacto del arreglo en todo lo
        # publicado (fiscal-mexicano y leyes-federales).
        id: compuertas
        if: env.TIENE_CLAUDE == 'true'
        env:
          OUT: ${{ github.workspace }}
          PDF_DIR: /tmp/pdfs
        run: |
          bash /tmp/extractor/scripts/agente/cerrar.sh compuertas
          echo "arreglo=$(python3 -c 'import json; print(json.load(open("/tmp/agente/arreglo.json"))["estado"])' 2>/dev/null || echo ninguno)" >> "$GITHUB_OUTPUT"

      - name: Guardar la caché de los PDF publicados
        # En cuanto se descargaron: lo que falle después no obliga a bajarlos otra vez.
        if: always() && steps.compuertas.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: /tmp/pdfs-corpus
          key: pdfs-corpus-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Agente — confirmar el impacto del arreglo en el corpus
        if: steps.compuertas.outputs.arreglo == 'impacto'
        timeout-minutes: 180
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IMPACTO: /tmp/agente/impacto-arreglo
        run: bash /tmp/extractor/scripts/agente/impacto.sh

      - name: Publicar el arreglo y veredicto
        id: agente
        if: env.TIENE_CLAUDE == 'true'
        env:
          EXTRACTOR_TOKEN: ${{ secrets.PR_TOKEN }}
          EXTRACTOR_SLUG: OpenCodice/fiscal-extractor
          REPORTE: /tmp/verificacion.md
          OUT: ${{ github.workspace }}
          PDF_DIR: /tmp/pdfs
        run: |
          if bash /tmp/extractor/scripts/agente/cerrar.sh publicar; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Veredicto de verificación
        id: veredicto
        run: echo "ok=${{ steps.agente.outputs.ok }}" >> "$GITHUB_OUTPUT"

      - name: Guardar el trabajo de la corrida
        # Si un arreglo del agente se descarta (p. ej. no se pudo publicar), su
        # parche queda aquí para recuperarlo en vez de repetir la corrida.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trabajo
          path: |
            /tmp/agente/*.json
            /tmp/agente/*.md
            /tmp/agente/*.log
            /tmp/agente/*.patch
            /tmp/agente/impacto-*/resumen.json
            /tmp/agente/impacto-*/pendientes.json
            /tmp/agente/impacto-*/veredicto*.json
            /tmp/agente/revision/*/veredicto*.json
            /tmp/agente/revision/*/resultado.json
            /tmp/verificacion.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Validar invariantes (gate)
        # Si la reconstrucción rompe un invariante (regresión del parser,
        # colisión, hueco…), el job falla y NO se abre PR.
        run: |
          PYTHONPATH=/tmp/extractor python -m extractor validar \
            --out "$GITHUB_WORKSPACE"

      - name: Actualizar la tabla de documentos del README
        # Refresca los enlaces a los PDF y las fechas de última reforma desde la
        # metadata recién reconstruida, para que entren en el mismo PR.
        run: python /tmp/extractor/scripts/readme_fiscal.py "$GITHUB_WORKSPACE"

      - name: Conservar la huella de cada documento en el índice
        # `build` reescribe metadata/documentos.json sin el sha256 del PDF ni el
        # commit del extractor de cada versión publicada; se traen de main.
        run: python /tmp/extractor/scripts/commits_por_documento.py "$GITHUB_WORKSPACE" --conservar-indice

      - name: ¿Cambió el texto vigente?
        id: cambios
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "hay_cambios=true" >> "$GITHUB_OUTPUT"
            git status --short | head -40
          else
            echo "hay_cambios=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios: el corpus coincide con las fuentes."
          fi

      - name: Generar cuerpo del PR
        if: steps.cambios.outputs.hay_cambios == 'true'
        run: |
          python /tmp/extractor/scripts/pr_summary.py "$GITHUB_WORKSPACE" > /tmp/cuerpo.md
          if [ -f /tmp/verificacion.md ]; then
            { echo; cat /tmp/verificacion.md; } >> /tmp/cuerpo.md
          fi
          cat /tmp/cuerpo.md

      - name: Un commit por documento
        # El historial de cada documento debe contar solo su propia historia:
        # un commit por documento con su título y sus trailers (reforma,
        # corrección, alta; los decide la causa: cambió el PDF, el extractor o
        # ambos) y uno aparte para lo compartido (índices, README).
        id: commits
        if: steps.cambios.outputs.hay_cambios == 'true' && steps.veredicto.outputs.ok == 'true'
        run: |
          git -C "$GITHUB_WORKSPACE" config user.name "${{ github.actor }}"
          git -C "$GITHUB_WORKSPACE" config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python /tmp/extractor/scripts/commits_por_documento.py "$GITHUB_WORKSPACE" \
            --pdf-dir /tmp/pdfs --extractor-dir /tmp/extractor \
            --titulo-indice "Índice del corpus fiscal y README al día"

      - name: Correcciones por confirmar
        # Una corrección (mismo PDF, otro extractor) solo se publica si cada
        # unidad que cambia está confirmada como mejora en el registro del
        # extractor (scripts/impacto.py). Lo que falte lo juzga el agente.
        id: correcciones
        if: steps.commits.outcome == 'success'
        run: |
          # Huella del registro antes del agente juez: lo que cambie en él
          # hasta `impacto.py cerrar` lo escribió el agente y no cuenta.
          echo "registro=$(git -C /tmp/extractor status --porcelain -uall -- verificaciones | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          python /tmp/extractor/scripts/impacto.py pendientes-commits "$GITHUB_WORKSPACE" \
            --base "${{ steps.commits.outputs.base }}" --trabajo /tmp/agente/impacto-vigilancia --pdf-dir /tmp/pdfs \
            --veredicto-agente /tmp/agente/veredicto.json \
            --extractor "OpenCodice/fiscal-extractor@$(git -C /tmp/extractor rev-parse HEAD)"

      - name: Agente — confirmar las correcciones
        if: steps.correcciones.outputs.pendientes == 'true' && env.TIENE_CLAUDE == 'true'
        timeout-minutes: 120
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IMPACTO: /tmp/agente/impacto-vigilancia
        run: bash /tmp/extractor/scripts/agente/impacto.sh

      - name: Registrar y exigir las correcciones confirmadas
        id: exigir
        if: steps.commits.outcome == 'success'
        env:
          EXTRACTOR_TOKEN: ${{ secrets.PR_TOKEN }}
          EXTRACTOR_SLUG: OpenCodice/fiscal-extractor
        run: |
          # El registro solo lo escribe `impacto.py cerrar`: lo que haya
          # cambiado en él durante el agente juez no puede contar como confirmado.
          if [ "$(git -C /tmp/extractor status --porcelain -uall -- verificaciones | sha256sum | cut -c1-16)" != "${{ steps.correcciones.outputs.registro }}" ]; then
            echo "::error::El registro de verificaciones cambió durante el agente juez; no se publica."
            exit 1
          fi
          if [ "${{ steps.correcciones.outputs.pendientes }}" = true ]; then
            python /tmp/extractor/scripts/impacto.py cerrar --trabajo /tmp/agente/impacto-vigilancia \
              --extractor "OpenCodice/fiscal-extractor@$(git -C /tmp/extractor rev-parse HEAD)" \
              --reporte /tmp/agente/impacto-vigilancia.md || true
          fi
          bash /tmp/extractor/scripts/agente/publicar_registro.sh "Correcciones verificadas del corpus fiscal"
          python /tmp/extractor/scripts/impacto.py exigir "$GITHUB_WORKSPACE" \
            --base "${{ steps.commits.outputs.base }}" && rc=0 || rc=$?
          # 0: todo confirmado; 1: hay que rehacer los commits. Otra cosa (una
          # excepción) no dice nada: no se publica.
          [ "$rc" -le 1 ] || { echo "::error::No se pudo comprobar el registro de correcciones (código $rc)."; exit 1; }

      - name: Rehacer los commits sin las correcciones no confirmadas
        if: steps.exigir.outputs.rehacer == 'true'
        run: |
          git reset -q --mixed "${{ steps.commits.outputs.base }}"
          python /tmp/extractor/scripts/commits_por_documento.py "$GITHUB_WORKSPACE" \
            --pdf-dir /tmp/pdfs --extractor-dir /tmp/extractor \
            --titulo-indice "Índice del corpus fiscal y README al día" \
            --verificadas /tmp/extractor/verificaciones/impacto
          [ -f /tmp/agente/impacto-vigilancia.md ] && cat /tmp/agente/impacto-vigilancia.md >> "$GITHUB_STEP_SUMMARY" || true
          # Lo que quede sin confirmar después de rehacer no se publica.
          python /tmp/extractor/scripts/impacto.py exigir "$GITHUB_WORKSPACE" --base "${{ steps.commits.outputs.base }}"

      - name: ¿Quedó algo que publicar?
        id: publicable
        if: steps.commits.outcome == 'success'
        run: |
          # create-pull-request también sube lo que quede sin commit, y eso no
          # pasó por los commits verificados: se descarta.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::Quedaron cambios sin commit tras los commits verificados; se descartan."
            git status --porcelain | head -20
            git checkout -q -- . && git clean -fdq
          fi
          echo "si=$([ "$(git rev-list --count "${{ steps.commits.outputs.base }}..HEAD")" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Abrir Pull Request
        id: pr
        # Solo se publica lo verificado. Lo que no pasó las compuertas no se
        # publica: el texto vigente se queda como está y la siguiente vigilancia
        # lo vuelve a intentar, con el agente reparando el extractor.
        if: steps.publicable.outputs.si == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # Con un PAT (secret PR_TOKEN) el PR nace atribuido a un usuario real.
          # Si el secret no existe, cae al GITHUB_TOKEN y el PR no se fusiona.
          token: ${{ secrets.PR_TOKEN || github.token }}
          branch: actualizacion/corpus-fiscal-automatica
          base: main
          title: '🧾 Cambio en el corpus fiscal (detección automática)'
          body-path: /tmp/cuerpo.md
          labels: |
            actualizacion
            automatico
            verificado
            ${{ steps.commits.outputs.tipo == 'correccion' && 'correccion-extraccion' || '' }}
          delete-branch: true

      - name: Anotar lo que no se publicó
        if: steps.cambios.outputs.hay_cambios == 'true' && steps.veredicto.outputs.ok != 'true'
        run: |
          {
            echo "## Cambios no publicados"
            echo "La extracción no pasó las compuertas; se conserva el texto vigente y la próxima vigilancia lo reintenta."
            if [ -f /tmp/verificacion.md ]; then cat /tmp/verificacion.md; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Alertar fuentes fallidas
        if: steps.reconstruir.outputs.fuentes_fallidas == 'true'
        run: |
          echo "::error::Alguna fuente no se pudo resolver o descargar (URL muerta o cambió la página del SAT). Revisa el log del paso de descarga."
          exit 1

  revisar:
    # Valida el PR en un job sin secretos y, si pasó y quedó verificado, lo
    # fusiona (revisar-pr.yml). Corre aunque la vigilancia haya fallado
    # después de abrirlo.
    needs: vigilar
    if: ${{ !cancelled() && needs.vigilar.outputs.pr != '' }}
    uses: ./.github/workflows/revisar-pr.yml
    with:
      repo: OpenCodice/fiscal-mexicano
      pr: ${{ needs.vigilar.outputs.pr }}
      prefijo: actualizacion/
    secrets:
      PR_TOKEN: ${{ secrets.PR_TOKEN }}

  estado:
    # El supervisor (OpenCodice/supervisor) lee el nombre de este job para
    # saber si quedó otra tanda, y el artefacto `cadena` (el resultado y las
    # salidas de cada job) para atender lo que pidieron (salidas `pedir*`).
    name: "estado pendiente=[false]"
    needs: [vigilar, revisar]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Lo que declaró cada job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS" > cadena.json
      - uses: actions/upload-artifact@v4
        with:
          name: cadena
          path: cadena.json
          retention-days: 14
